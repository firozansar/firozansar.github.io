---
layout: layout
title: Blog
---

<div class="container">
<h3>Technical Blog</h3>
  <div class="panel panel-default">
    <div class="panel-body">
		{% for post in site.posts %}
			<div class="row">
				 <div class="col-sm-4 col-md-4 col-lg-4">
					 <h5 style="text-align: right">
					 	{{ post.date | date: "%B %e, %Y" }}
					 </h5>
				 </div>
				 <div class="col-sm-8 col-md-8 col-lg-8">
					 <h5 style="text-align: left">
					 	<strong><a href="{{ post.url | relative_url }}">{{ post.title }}</a></strong>
					 </h5>
				 </div>
			</div>
	    {% endfor %}
	</div>
  </div>
  <section class="thirteen columns">
    <h2>Travel Vlog</h2>
	<article>
		<header>
		  <h3>Iceland Trip 2021</h3>
		</header>
		<div class="panel-body">
		  <div class="embed-responsive embed-responsive-16by9">
			<iframe class="embed-responsive-item" title="Iceland Trip 2021" loading="lazy" allowfullscreen
			  src="https://www.youtube.com/embed/w_pi9zSG8Dw?rel=0">
			</iframe>
		  </div>
	    </div>
	</article>
    <article>
      <header>
        <h3>Paris Trip 2022</h3>
      </header>
      <div class="panel-body">
		<div class="embed-responsive embed-responsive-16by9">
		  <iframe class="embed-responsive-item" title="Paris Trip 2022" loading="lazy" allowfullscreen
			src="https://www.youtube.com/embed/QJkEZgz-UFg?rel=0">
		  </iframe>
		</div>
      </div>
    </article>
	<article>
		<header>
		  <h3>Belgium Trip 2022</h3>
		</header>
		<div class="panel-body">
		  <div class="embed-responsive embed-responsive-16by9">
			<iframe class="embed-responsive-item" title="Belgium Trip 2022" loading="lazy" allowfullscreen
			  src="https://www.youtube.com/embed/6ZlTcil93qM?rel=0">
			</iframe>
		  </div>
	  	</div>
	</article>
	<article>
		<header>
		  <h3>Oslo Trip 2022</h3>
		</header>
		<div class="panel-body">
		  <div class="embed-responsive embed-responsive-16by9">
			<iframe class="embed-responsive-item" title="Oslo Trip 2022" loading="lazy" allowfullscreen
			  src="https://www.youtube.com/embed/JHjfOHr11cM?rel=0">
			</iframe>
		  </div>
	  	</div>
	</article>
  </section>
</div>
