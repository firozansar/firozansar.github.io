<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="{{ site.author }}">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="theme-color" content="#070b14">
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/assets/img/icons/apple-touch-icon.png' | relative_url }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

    {% if page.title %}
      <title>{{ page.title }} | {{ site.title }}</title>
    {% else %}
      <title>{{ site.title }} — Android Developer</title>
    {% endif %}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="{{ '/static/css/main.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/static/css/syntax.css' | relative_url }}">

    <script>document.documentElement.classList.add('js-ready');</script>

    <!-- Google Analytics -->
    {% include analytics.html %}
  </head>
  <body>
    <div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>
    <div class="ambient-bg" aria-hidden="true">
      <div class="ambient-orb ambient-orb-1"></div>
      <div class="ambient-orb ambient-orb-2"></div>
      <div class="ambient-orb ambient-orb-3"></div>
    </div>

    <main id="top" class="site-main">
      {{ content }}
    </main>

    {% include footer.html %}

    <script src="{{ '/static/js/main.js' | relative_url }}" defer></script>
  </body>
</html>
